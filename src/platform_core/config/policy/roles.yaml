# Meridian policy config (TECH-5). Versioned; every decision logs the version.
# Changing access rules is an edit here (reviewed config), never code.
version: "2026-06-10.1"

roles:
  hr-admin:
    capabilities:
      - person.read
      - person.write
      - comp.read
    scope:
      countries: ["*"]
      org_subtrees: ["/"]
      populations: ["*"]
    max_tier: T2

  hr-admin-us:
    capabilities:
      - person.read
      - person.write
    scope:
      countries: ["US"]
      org_subtrees: ["/"]
      populations: ["*"]
    max_tier: T2

  manager:
    capabilities:
      - person.read
    scope:
      countries: ["*"]
      org_subtrees: []   # populated per-assignment at runtime in later modules
      populations: ["*"]
    max_tier: T1

  employee:
    capabilities:
      - person.read.self
    scope:
      countries: ["*"]
      org_subtrees: ["/"]
      populations: ["*"]
    max_tier: T1

  auditor:
    capabilities:
      - audit.verify
      - catalog.read
    scope:
      countries: ["*"]
      org_subtrees: ["/"]
      populations: ["*"]
    max_tier: T0
