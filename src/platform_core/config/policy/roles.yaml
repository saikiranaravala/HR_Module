# Meridian policy config (TECH-5). Versioned; every decision logs the version.
# Changing access rules is an edit here (reviewed config), never code.
version: "2026-06-11.1"

roles:
  er-investigator:
    # ER cases are a segregated tier (Specs/10 §5): only this role reads them.
    capabilities:
      - case.read
      - case.read-er
    scope:
      countries: ["*"]
      org_subtrees: ["/"]
      populations: ["*"]
    max_tier: T3

  case-agent:
    capabilities:
      - case.read
    scope:
      countries: ["*"]
      org_subtrees: ["/"]
      populations: ["*"]
    max_tier: T1

  recruiter:
    capabilities:
      - candidate.read
    scope:
      countries: ["*"]
      org_subtrees: ["/"]
      populations: ["*"]
    max_tier: T1

  exec-talent:
    # Succession tier 1: executive talent team — full slate access (T3, read-audited).
    capabilities:
      - succession.read
    scope:
      countries: ["*"]
      org_subtrees: ["/"]
      populations: ["*"]
    max_tier: T3

  division-hr-talent-emea:
    # Succession tier 2: division HR — own-division slates only.
    capabilities:
      - succession.read
    scope:
      countries: ["*"]
      org_subtrees: ["/corp/emea/"]
      populations: ["*"]
    max_tier: T3

  recruiter-lead:
    # Sees restricted hiring flags (do-not-rehire) — policy-gated, audited.
    capabilities:
      - candidate.read
      - candidate.read-dnr
    scope:
      countries: ["*"]
      org_subtrees: ["/"]
      populations: ["*"]
    max_tier: T2

  hr-admin:
    capabilities:
      - person.read
      - person.write
      - comp.read
    scope:
      countries: ["*"]
      org_subtrees: ["/"]
      populations: ["*"]
    max_tier: T2

  hr-admin-us:
    capabilities:
      - person.read
      - person.write
    scope:
      countries: ["US"]
      org_subtrees: ["/"]
      populations: ["*"]
    max_tier: T2

  manager:
    capabilities:
      - person.read
    scope:
      countries: ["*"]
      org_subtrees: []   # populated per-assignment at runtime in later modules
      populations: ["*"]
    max_tier: T1

  employee:
    capabilities:
      - person.read.self
    scope:
      countries: ["*"]
      org_subtrees: ["/"]
      populations: ["*"]
    max_tier: T1

  auditor:
    capabilities:
      - audit.verify
      - catalog.read
    scope:
      countries: ["*"]
      org_subtrees: ["/"]
      populations: ["*"]
    max_tier: T0
