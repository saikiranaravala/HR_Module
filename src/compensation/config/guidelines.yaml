# Merit guideline matrix (COMP-2): rating × compa-quartile → recommended %.
# Rating keys are OPAQUE strings: the ratings-philosophy decision (00-INDEX
# gate) only changes this file. A ratingless cycle = single 'default' key.
matrix:
  exceeds:
    "1": {min: 5, max: 8}
    "2": {min: 4, max: 6}
    "3": {min: 3, max: 5}
    "4": {min: 0, max: 3}
  meets:
    "1": {min: 3, max: 5}
    "2": {min: 2, max: 4}
    "3": {min: 1, max: 3}
    "4": {min: 0, max: 2}
  below:
    "1": {min: 0, max: 2}
    "2": {min: 0, max: 1}
    "3": {min: 0, max: 0}
    "4": {min: 0, max: 0}
  default:   # ratingless fallback pending the philosophy decision
    "1": {min: 0, max: 6}
    "2": {min: 0, max: 5}
    "3": {min: 0, max: 4}
    "4": {min: 0, max: 3}
