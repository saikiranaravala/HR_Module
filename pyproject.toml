[project]
name = "meridian"
version = "0.1.0"
description = "Project Meridian - AI-native HCM platform (local build)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["src/test"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["test*"]
